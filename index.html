<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Necromunda (N26) Attack Simulator</title>
<meta name="description" content="Offline exact-probability calculator for Necromunda ranged and melee attacks.">
<style>
:root{
  --bg:#12131a; --panel:#1b1d27; --panel-2:#232635; --line:#333749;
  --ink:#e9eaf2; --ink-dim:#a0a4bb; --ink-faint:#71768f;
  --accent:#e0a458; --accent-ink:#1a1206;
  --ooa:#e0574a; --serious:#e0a458; --flesh:#6fb3d8; --ok:#4f9d69;
  --radius:10px; --gap:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 64px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{padding:18px 0 10px}
h1{font-size:19px;margin:0 0 3px;letter-spacing:.2px}
.sub{color:var(--ink-faint);font-size:13px;margin:0}

/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0 16px;background:var(--panel);padding:5px;border-radius:var(--radius);border:1px solid var(--line)}
.tabs button{
  flex:1;appearance:none;border:0;border-radius:7px;background:transparent;color:var(--ink-dim);
  font:600 15px/1 inherit;padding:12px 8px;cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* results */
.results{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:8px 0 10px;margin:0 0 4px;
}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.odd{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 8px;
  text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.odd .v{font:700 25px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.5px}
.odd .k{font-size:11px;color:var(--ink-dim);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
.odd.flesh .v{color:var(--flesh)} .odd.serious .v{color:var(--serious)} .odd.ooa .v{color:var(--ooa)}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--panel-2)}
.bar i{display:block;height:100%}
.minor{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:12.5px;color:var(--ink-dim)}
.minor b{color:var(--ink);font-weight:600;font-family:ui-monospace,Menlo,monospace}
.warn,.info{margin-top:9px;font-size:12.5px;border-radius:8px;padding:8px 10px}
.warn{color:var(--accent);background:rgba(224,164,88,.09);border:1px solid rgba(224,164,88,.32)}
.info{color:var(--ink-dim);background:var(--panel);border:1px solid var(--line)}
.warn p,.info p{margin:0 0 4px} .warn p:last-child,.info p:last-child{margin:0}
.info b{color:var(--ink)}
.profile{grid-column:1/-1;margin:2px 0 0;font-size:12.5px;color:var(--ink-dim);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
.profile b{color:var(--ink);font-family:inherit}

/* form */
fieldset{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin:0 0 var(--gap);padding:6px 12px 12px}
legend{font:600 12px/1 inherit;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--ink-dim)}
.f select,.f input[type=text]{
  appearance:none;width:100%;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:10px 26px 10px 10px;font:15px/1.2 inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%23a0a4bb'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;
}
.f select:focus-visible,.tabs button:focus-visible,.chk:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.f.wide{grid-column:1/-1}
.chks{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chk{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:20px;padding:8px 13px 8px 10px;font-size:13.5px;cursor:pointer;color:var(--ink-dim)}
.chk input{accent-color:var(--accent);margin:0;width:16px;height:16px}
.chk:has(input:checked){border-color:var(--accent);color:var(--ink)}
.chk.wide{flex:1 1 100%;border-radius:8px}
details{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin:0 0 var(--gap);padding:0}
details>summary{padding:12px;font:600 13px/1 inherit;color:var(--ink-dim);cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--accent)}
details[open]>summary::before{content:"▾ "}
details .body{padding:0 12px 12px}
details p{margin:0 0 8px;font-size:13px;color:var(--ink-dim)}
details code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:12px}
.note{font-size:12px;color:var(--ink-faint);margin:6px 0 0}
.hidden{display:none !important}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.scope select{appearance:none;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:20px;padding:8px 28px 8px 12px;font:13.5px/1.2 inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%23a0a4bb'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
.scope .note{flex:1 1 100%;margin:0}
table.val{width:100%;border-collapse:collapse;font-size:13.5px;margin:2px 0 0}
table.val th{text-align:left;font-weight:600;color:var(--ink-dim);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;padding:0 6px 6px 0;border-bottom:1px solid var(--line)}
table.val td{padding:7px 6px 7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
table.val tr:last-child td{border-bottom:0}
table.val td.n{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
table.val td.good{color:var(--ok);font-weight:600}
table.val td.bad{color:var(--ooa);font-weight:600}
table.val td.thin{color:var(--accent)}
table.val td.dim{color:var(--ink-faint)}
.fitline{font-size:12.5px;color:var(--ink-dim);margin:0 0 10px}
.fitline b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
footer{color:var(--ink-faint);font-size:12px;text-align:center;padding:22px 14px 0;line-height:1.6}
@media (max-width:380px){ .odd .v{font-size:21px} }
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .15s ease} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Necromunda (N26) Attack Simulator</h1>
  <p class="sub">Exact odds for one attacker, one weapon, one target, one activation. No dice are rolled.</p>
</header>

<div class="tabs" role="tablist">
  <button role="tab" id="tab-ranged" aria-controls="panel-ranged" aria-selected="true">Ranged</button>
  <button role="tab" id="tab-melee" aria-controls="panel-melee" aria-selected="false">Melee</button>
  <button role="tab" id="tab-value" aria-controls="panel-value" aria-selected="false">Value</button>
</div>

<div class="scope">
  <label class="chk"><input type="checkbox" id="opt-gang"><span>Include gang list weapons</span></label>
  <select id="opt-which" class="hidden" aria-label="Which gang list"></select>
  <p class="note" id="opt-note"></p>
</div>

<section id="panel-ranged" role="tabpanel" aria-labelledby="tab-ranged"></section>
<section id="panel-melee" role="tabpanel" aria-labelledby="tab-melee" class="hidden"></section>
<section id="panel-value" role="tabpanel" aria-labelledby="tab-value" class="hidden"></section>

<footer>
  Unofficial fan-made tool. Necromunda is a trademark of Games Workshop Ltd.<br>
  Works offline — no network, no storage, no accounts.
</footer>
</div>

<script id="engine">
/* ==========================================================================
   ENGINE — exact probabilities, no sampling.
   Pure functions, no DOM access. Page references are to the N26 core rules.
   ========================================================================== */
const Engine = (function () {
  'use strict';

  /* Target condition ladder (p77). A model on 0 Wounds is automatically
     Injured; Serious Injury and Out of Action escalate from there. */
  const NONE = 0, INJURED = 1, SERIOUS = 2, OOA = 3;

  /* A target state packs into one integer: wounds, condition, webbed, blind.
     Webbed (p165) and Blind (p162) never affect later damage maths, but they
     are outcomes worth reporting, so they ride along as flags. */
  const enc = (w, cond, web, blind) => (((w << 2) | cond) << 2) | (web ? 2 : 0) | (blind ? 1 : 0);
  const dec = (id) => ({ w: id >> 4, cond: (id >> 2) & 3, web: !!(id & 2), blind: !!(id & 1) });

  function addTo(map, id, p) {
    if (p > 0) map.set(id, (map.get(id) || 0) + p);
  }

  const clamp01 = (x) => Math.max(0, Math.min(1, x));

  /* ---- Wound roll (p76) ------------------------------------------------ */
  function woundTarget(S, T) {
    if (S >= 2 * T) return 2;   // Str twice T or greater
    if (S > T) return 3;        // Str greater than T
    if (S === T) return 4;      // Str equal to T
    if (2 * S <= T) return 6;   // Str half T or lower
    return 5;                   // Str lower than T
  }

  /* ---- Save roll (p76) -------------------------------------------------
     Only one save per hit, so the model takes whichever is better. AP, cover
     and characteristic bumps all fold into `mods` (positive = better save).
     Invulnerable saves ignore modifiers. A natural 1 or 2 always fails. */
  function saveProb(sv, mods, inv, allowArmour) {
    let best = 0;
    if (allowArmour && sv) {
      const need = Math.max(3, sv - mods);
      if (need <= 6) best = Math.max(best, (7 - need) / 6);
    }
    if (inv) {
      const need = Math.max(3, inv);
      if (need <= 6) best = Math.max(best, (7 - need) / 6);
    }
    return best;
  }

  /* ---- Injury dice (p77) -----------------------------------------------
     Per the dice symbols chart, the Injury dice reads 1-2 Flesh Wound,
     3-5 Seriously Injured, 6 Out of Action.

     The attacker rolls Lethality dice and selects one, so they take the best
     available result: Out of Action, else Serious Injury, else Injured.
     Lethality 0 means no dice — the target is simply Injured at 0 Wounds. */
  const INJURY_DICE = { ooa: 1, si: 3, inj: 2 };
  function injuryPick(L, faces) {
    if (L <= 0) return { ooa: 0, si: 0, inj: 1 };
    const notOoa = Math.pow((faces.si + faces.inj) / 6, L);
    const onlyInj = Math.pow(faces.inj / 6, L);
    return { ooa: 1 - notOoa, si: notOoa - onlyInj, inj: onlyInj };
  }

  /* An unsaved wound costs the target `damage` Wounds (Damage (X), p162). */
  function applyDamage(id, damage, L, faces, out, p) {
    const s = dec(id);
    const nw = Math.max(0, s.w - damage);
    if (nw > 0) { addTo(out, enc(nw, s.cond, s.web, s.blind), p); return; }
    const pick = injuryPick(L, faces);
    addTo(out, enc(0, OOA, s.web, s.blind), p * pick.ooa);
    // 'Serious Injury' has no effect on a model that is already Seriously Injured.
    addTo(out, enc(0, Math.max(s.cond, SERIOUS), s.web, s.blind), p * pick.si);
    addTo(out, enc(0, Math.max(s.cond, INJURED), s.web, s.blind), p * pick.inj);
  }

  /* ---- One hit, from wound roll to injury dice --------------------------
     Returns a list of weighted effects. Effects are independent of the
     target's current state, so this is computed once and reused. */
  function hitEffects(ctx, autoWound) {
    const w = ctx.weapon, t = ctx.target, eff = [];

    // Flash (p162): no wound roll at all, just an Initiative check.
    if (w.flash) {
      const pBlind = clamp01((6 - t.initiative) / 6);
      eff.push({ p: pBlind, wounded: false, blind: true });
      eff.push({ p: 1 - pBlind, wounded: false });
      return eff;
    }

    // Graviton Pulse (p163): Strength check instead of a wound roll, no armour save.
    if (w.graviton) {
      const pFail = clamp01((6 - t.strength) / 6);
      const pSave = saveProb(0, 0, t.inv, false);
      eff.push({ p: pFail * (1 - pSave), wounded: true, damage: w.damage, L: w.lethality });
      eff.push({ p: pFail * pSave, wounded: false });
      eff.push({ p: 1 - pFail, wounded: false });
      return eff;
    }

    // Shock (p164) counts as a natural 6 on the wound roll for other traits.
    const rolls = autoWound ? [{ face: 6, p: 1 }] : [1, 2, 3, 4, 5, 6].map(f => ({ face: f, p: 1 / 6 }));

    for (const r of rolls) {
      const wounds = autoWound || r.face >= ctx.woundTarget;
      // Blaze (p162) triggers off the wound roll even if the hit failed to wound.
      const blaze = w.blaze > 0 && r.face >= w.blaze;
      if (!wounds) { eff.push({ p: r.p, wounded: false, blaze: blaze }); continue; }

      const rending   = w.rending   > 0 && r.face >= w.rending;    // AP improved by 1
      const shred     = w.shred     > 0 && r.face >= w.shred;      // Lethality +1
      const breaching = w.breaching > 0 && r.face >= w.breaching;  // no armour saves

      const allowArmour = !w.gas && !w.web && !breaching;
      let inv = t.inv;
      if (w.gas && t.respirator) inv = inv ? Math.min(inv, 5) : 5;  // respirator, p163
      const pSave = saveProb(t.sv, w.ap + (rending ? -1 : 0) + t.saveMods, inv, allowArmour);

      if (w.web) {  // Web (p165): the target is Webbed instead of losing a Wound.
        eff.push({ p: r.p * (1 - pSave), wounded: false, web: true, blaze: blaze });
      } else {
        eff.push({ p: r.p * (1 - pSave), wounded: true, damage: w.damage,
                   L: w.lethality + (shred ? 1 : 0), blaze: blaze });
      }
      eff.push({ p: r.p * pSave, wounded: false, blaze: blaze });
    }
    return eff;
  }

  /* Push a whole state distribution through one hit. */
  function applyHit(dist, ctx, effects, allowBlaze) {
    const out = new Map();
    for (const [id, p0] of dist) {
      if (((id >> 2) & 3) === OOA) { addTo(out, id, p0); continue; }  // already gone
      const s = dec(id);
      for (const e of effects) {
        const p = p0 * e.p;
        if (p <= 0) continue;
        let sub;
        if (e.wounded) {
          sub = new Map();
          applyDamage(id, e.damage, e.L, ctx.faces, sub, 1);
        } else {
          sub = new Map([[enc(s.w, s.cond, s.web || !!e.web, s.blind || !!e.blind), 1]]);
        }
        // Blaze: one additional hit with the same profile, which cannot chain.
        if (e.blaze && allowBlaze) sub = applyHit(sub, ctx, ctx.effects, false);
        for (const [k, q] of sub) addTo(out, k, p * q);
      }
    }
    return out;
  }

  /* ---- Firepower dice (p72) --------------------------------------------
     A D6 marked, per the dice symbols chart: 1 = one hit plus the ammo
     symbol, 2-3 = one hit, 4-5 = two hits, 6 = three hits. Hits equal the
     total bullet holes across the dice rolled. */
  function firepowerDist(n) {
    let dist = new Map([[0, 1]]);
    for (let i = 0; i < n; i++) {
      const next = new Map();
      for (const [total, p] of dist) {
        addTo(next, total + 1, p * 3 / 6);   // faces 1, 2, 3
        addTo(next, total + 2, p * 2 / 6);   // faces 4, 5
        addTo(next, total + 3, p * 1 / 6);   // face 6
      }
      dist = next;
    }
    return dist;
  }

  /* ---- Blast scatter (p162) ---------------------------------------------
     A Blast marker that misses scatters D6" in the direction of the Scatter
     dice, which reads 1-4 Arrow and 5-6 Hit (with arrow). A Hit symbol
     alongside a 1 is a misfire and centres the marker on the firer instead.

     A 3" or 5" marker that moves only 1" or 2" still covers the model it was
     aimed at, so those distances are counted as hits on the target. */
  const SCATTER_MISFIRE = (2 / 6) * (1 / 6);                 // crosshair face plus a 1
  const SCATTER_COVERS = (1 / 6) * (4 / 6) + (1 / 6);        // 1" by arrow, or 2" any face

  /* Hit roll (p72 / p74). Natural 1 always misses, natural 6 always hits. */
  const isHit = (face, skill, mod) => face === 6 || (face !== 1 && face + mod >= skill);

  /* ---- Context assembly ------------------------------------------------ */
  function startState(t) {
    if (t.status === 'seriously') return enc(0, SERIOUS, false, false);
    if (t.status === 'injured') return enc(0, INJURED, false, false);
    return enc(t.W, NONE, false, false);
  }

  function buildCtx(input) {
    const w = input.weapon, t = input.target;
    const problems = [];

    let wt;
    if (w.toxin > 0) {
      wt = w.toxin;   // Toxin (p165): wounds on X+, whatever the Toughness
    } else if (w.str === null) {
      wt = 7;  // Strength '-' with no trait to resolve it: the hit does nothing.
      problems.push('This profile has no Strength and no trait that replaces the wound roll, so no wound is possible. Set a Strength, or pick Toxin / Graviton Pulse / Flash / Web.');
    } else {
      wt = woundTarget(w.str, t.T);
    }

    const ctx = {
      weapon: w, target: t, faces: input.faces, woundTarget: wt,
      problems: problems
    };
    ctx.effects = hitEffects(ctx, false);
    ctx.shockEffects = hitEffects(ctx, true);
    return ctx;
  }

  /* ---- Ranged attack (p72) ---------------------------------------------
     One hit roll for the whole attack; Rapid Fire turns that single success
     into several hits, all of which share the hit roll's trait triggers. */
  function computeRanged(input) {
    const ctx = buildCtx(input);
    const w = input.weapon, t = input.target;
    const start = startState(t);
    const fp = firepowerDist(w.rapidFire > 0 ? w.rapidFire : 0);
    const singleHit = new Map([[1, 1]]);
    const hitCounts = w.rapidFire > 0 ? fp : singleHit;

    // -1 to hit a Seriously Injured target (p72).
    const mod = input.hitMod + (t.status === 'seriously' ? -1 : 0);

    const branches = w.autoHit
      ? [{ p: 1, hit: true, shock: false }]
      : [1, 2, 3, 4, 5, 6].map(f => ({
          p: 1 / 6,
          hit: isHit(f, input.skill, mod),
          shock: w.shock > 0 && f >= w.shock
        }));

    const out = new Map();
    const resolveHits = (effects, weight) => {
      if (weight <= 0) return;
      for (const [n, pn] of hitCounts) {
        let dist = new Map([[start, 1]]);
        for (let i = 0; i < n; i++) dist = applyHit(dist, ctx, effects, true);
        for (const [k, q] of dist) addTo(out, k, weight * pn * q);
      }
    };

    let pDirect = 0, pScatterHit = 0, pMisfire = 0;
    for (const b of branches) {
      if (b.hit) {
        pDirect += b.p;
        resolveHits(b.shock ? ctx.shockEffects : ctx.effects, b.p);
      } else if (w.blast) {
        // A scattered marker may still cover the target. It came off a failed
        // hit roll, so Shock (X+), which keys off that roll, cannot trigger.
        pScatterHit += b.p * SCATTER_COVERS;
        pMisfire += b.p * SCATTER_MISFIRE;
        resolveHits(ctx.effects, b.p * SCATTER_COVERS);
        addTo(out, start, b.p * (1 - SCATTER_COVERS));
      } else {
        addTo(out, start, b.p);
      }
    }

    let expectedHits = 0;
    for (const [n, pn] of hitCounts) expectedHits += n * pn;
    const pHit = pDirect + pScatterHit;
    return summarise(out, start, { ctx: ctx, pHit: pHit, expectedHits: pHit * expectedHits,
                                   pScatterHit: pScatterHit, pMisfire: pMisfire });
  }

  /* ---- Melee attack (p74) ----------------------------------------------
     Every Attack dice is its own Weapon Skill test, and hits are resolved
     in sequence, so the target's state carries from one attack to the next. */
  function computeMelee(input) {
    const start = startState(input.target);
    let dist = new Map([[start, 1]]);
    let pAnyHit = 0, expectedHits = 0;
    const problems = [];
    let firstCtx = null;

    for (const weaponInput of input.weapons) {
      const ctx = buildCtx({ weapon: weaponInput.weapon, target: input.target, faces: input.faces });
      if (!firstCtx) firstCtx = ctx;
      for (const p of ctx.problems) if (problems.indexOf(p) < 0) problems.push(p);
      const w = weaponInput.weapon;
      let pMissAll = 1;
      for (let a = 0; a < weaponInput.attacks; a++) {
        if (w.autoHit) {
          dist = applyHit(dist, ctx, ctx.effects, true);
          pMissAll = 0; expectedHits += 1;
          continue;
        }
        const out = new Map();
        let pThis = 0;
        for (let f = 1; f <= 6; f++) {
          const p = 1 / 6;
          if (!isHit(f, weaponInput.skill, weaponInput.hitMod)) {
            for (const [k, q] of dist) addTo(out, k, p * q);
            continue;
          }
          pThis += p;
          const effects = (w.shock > 0 && f >= w.shock) ? ctx.shockEffects : ctx.effects;
          const sub = applyHit(dist, ctx, effects, true);
          for (const [k, q] of sub) addTo(out, k, p * q);
        }
        pMissAll *= (1 - pThis);
        expectedHits += pThis;
        dist = out;
      }
      pAnyHit = 1 - (1 - pAnyHit) * pMissAll;
    }

    firstCtx.problems = problems;
    return summarise(dist, start, { ctx: firstCtx, pHit: pAnyHit, expectedHits: expectedHits });
  }

  /* ---- Reporting -------------------------------------------------------- */
  function summarise(dist, startId, extra) {
    const s0 = dec(startId);
    const r = { fleshWound: 0, serious: 0, outOfAction: 0, wounded: 0, unharmed: 0,
                webbed: 0, blinded: 0, expectedWoundsLost: 0, total: 0 };
    for (const [id, p] of dist) {
      const s = dec(id);
      r.total += p;
      if (s.web) r.webbed += p;
      if (s.blind) r.blinded += p;
      r.expectedWoundsLost += (s0.w - s.w) * p;
      if (s.cond === OOA) r.outOfAction += p;
      else if (s.cond === SERIOUS) r.serious += p;
      else if (s.cond === INJURED) r.fleshWound += p;
      else if (s.w < s0.w) r.wounded += p;
      else r.unharmed += p;
    }
    r.changed = 1 - probOf(dist, startId);
    r.pHit = extra.pHit;
    r.expectedHits = extra.expectedHits;
    r.scatterHit = extra.pScatterHit || 0;
    r.misfire = extra.pMisfire || 0;
    r.problems = extra.ctx.problems;
    r.woundTarget = extra.ctx.woundTarget;
    r.perHit = perHitBreakdown(extra.ctx);
    r.startsInjured = s0.cond >= INJURED;
    r.startCond = s0.cond;
    return r;
  }

  function probOf(dist, id) { return dist.get(id) || 0; }

  /* Chance that a single hit wounds, and that a wound goes unsaved. */
  function perHitBreakdown(ctx) {
    let pWound = 0, pUnsaved = 0;
    for (const e of ctx.effects) {
      if (e.wounded || e.web) pUnsaved += e.p;
    }
    if (ctx.weapon.flash) return { pWound: 0, pUnsaved: 0 };
    if (ctx.weapon.graviton) {
      pWound = Math.max(0, Math.min(1, (6 - ctx.target.strength) / 6));
      return { pWound: pWound, pUnsaved: pUnsaved };
    }
    pWound = ctx.woundTarget > 6 ? 0 : (7 - ctx.woundTarget) / 6;
    return { pWound: pWound, pUnsaved: pUnsaved };
  }

    computeRanged: computeRanged, computeMelee: computeMelee,
    woundTarget: woundTarget, saveProb: saveProb, injuryPick: injuryPick,
    firepowerDist: firepowerDist, isHit: isHit, INJURY_DICE: INJURY_DICE,
