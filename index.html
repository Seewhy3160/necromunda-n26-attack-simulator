  const GANGS = ['Goliath', 'Delaque', 'Escher', 'Orlock', 'Van Saar'];

  const gangRanged = GANG_RANGED.map(r => ({
    name: r[0], gang: r[1], creds: r[2], cat: r[1] + ' list', sr: r[3], lr: r[4],
    str: r[5], ap: r[6], lethality: r[7], traitText: r[8], traits: parseTraits(r[8])
  }));
  const gangMelee = GANG_MELEE.map(r => ({
    name: r[0], gang: r[1], creds: r[2], cat: r[1] + ' list', sr: 'E', lr: '-',
    str: r[3], ap: r[4], lethality: r[5], traitText: r[6], traits: parseTraits(r[6])
  }));

  /* One price buys every profile of these, so a single profile understates what
     the credits bought. They are scored but held out of the fit. */
  const MULTI_PROFILE = [
    'Combat shotgun', 'Sawn-off shotgun', 'Shotgun -', 'Grenade launcher'
  ];
  const GANG_MULTI = ['Combi-pistol', 'Assault grenade launcher', 'Combi-weapon', 'Shotgun - acid'];
  const isMultiProfile = (name) =>
    MULTI_PROFILE.concat(GANG_MULTI).some(p => name.indexOf(p) === 0);

  /* The weapon list to offer, given whether gang lists are allowed and which.
     Off by default so the Trading Post is not swamped by house-only kit. */
  function weapons(kind, opts) {
    const base = kind === 'melee' ? meleeUsable : ranged;
    if (!opts || !opts.includeGang) return base;
    const extra = (kind === 'melee' ? gangMelee : gangRanged)
      .filter(w => !opts.gang || opts.gang === 'all' || w.gang === opts.gang);
    return base.concat(extra);
  }

  const priceOf = (p) => p.creds !== undefined ? p.creds : COSTS[p.name];

  return { ranged: ranged, melee: meleeUsable, fighters: FIGHTERS, parseTraits: parseTraits,
           costs: COSTS, isMultiProfile: isMultiProfile,
           gangRanged: gangRanged, gangMelee: gangMelee, gangs: GANGS,
           weapons: weapons, priceOf: priceOf, tradePoints: TRADE_POINTS };
})();
if (typeof module !== 'undefined') module.exports = Data;
</script>

<script id="pricing">
/* ==========================================================================
   PRICING — what the Trading Post charges per stat, fitted from its own prices.
   This asks nothing about how good a weapon is, only what the market bills for
   a point of Strength, a point of AP, a Lethality step and so on.
   ========================================================================== */
const Pricing = (function () {
  'use strict';

  /* Ridge rather than plain least squares: there are only ~40 usable weapons and
     good weapons tend to be good at everything, so Strength, AP and Lethality
     move together and an unpenalised fit swings wildly on one weapon. */
  const LAMBDA = 3;

  function solve(A, b) {
    const n = A.length;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let col = 0; col < n; col++) {
      let piv = col;
      for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      if (Math.abs(M[piv][col]) < 1e-12) continue;
      const t = M[col]; M[col] = M[piv]; M[piv] = t;
      for (let r = 0; r < n; r++) {
        if (r === col) continue;
        const f = M[r][col] / M[col][col];
        for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c];
      }
    }
    return M.map((row, i) => Math.abs(row[i]) < 1e-12 ? 0 : row[n] / row[i]);
  }

  function ridge(rows, y, lambda) {
    const n = rows.length, p = rows[0].length, mean = [], sd = [];
    for (let j = 0; j < p; j++) {
      const col = rows.map(r => r[j]);
      const m = col.reduce((a, b) => a + b, 0) / n;
      const s = Math.sqrt(col.reduce((a, b) => a + (b - m) * (b - m), 0) / n) || 1;
      mean.push(m); sd.push(s);
    }
    const Z = rows.map(r => r.map((v, j) => (v - mean[j]) / sd[j]));
    const yMean = y.reduce((a, b) => a + b, 0) / y.length;
    const yc = y.map(v => v - yMean);
    const XtX = [], Xty = [];
    for (let i = 0; i < p; i++) {
      XtX.push([]);
      for (let j = 0; j < p; j++) {
        XtX[i].push(Z.reduce((a, r) => a + r[i] * r[j], 0) + (i === j ? lambda : 0));
      }
      Xty.push(Z.reduce((a, r, k) => a + r[i] * yc[k], 0));
    }
    const bz = solve(XtX, Xty);
    const coef = bz.map((b, j) => b / sd[j]);
    const intercept = yMean - coef.reduce((a, b, j) => a + b * mean[j], 0);
    const pred = rows.map(r => intercept + r.reduce((a, v, j) => a + v * coef[j], 0));
    const ssRes = y.reduce((a, v, i) => a + (v - pred[i]) * (v - pred[i]), 0);
    const ssTot = y.reduce((a, v) => a + (v - yMean) * (v - yMean), 0);
    return { coef: coef, intercept: intercept, pred: pred,
             r2: 1 - ssRes / ssTot,
             mae: y.reduce((a, v, i) => a + Math.abs(v - pred[i]), 0) / n };
  }

  const inches = (s) => { const m = String(s).match(/(\d+)/); return m ? +m[1] : 0; };

  /* An (X+) trait fires on a 6 minus X plus one faces in six, so Breaching (5+)
     is worth twice Breaching (6+). Scoring it as a flag would price those the
     same, which is wrong. The feature is the chance of triggering; the
     coefficient then reads as credits per full 6-in-6 of it, and the panel
     expands that back out into the values the list actually uses. */
  const rate = (x) => x ? (7 - x) / 6 : 0;

  /* A blast marker's worth is the ground it covers, and a 5" marker covers
     (5/3)^2 of a 3" one. Left as two free flags the fit inverts them — only
     four weapons carry the 5" marker and all of them are grenades, so the
     coefficient chases what grenades cost rather than what the marker is
     worth. Encoding the geometry keeps the ordering right by construction and
     spends all seventeen blast weapons on one coefficient instead of splitting
     them; the data still sets the scale, only the ratio is fixed. */
  const BLAST_AREA = { '3': 1, '5': (5 / 3) * (5 / 3) };
  const blastArea = (txt) => {
    const m = txt.match(/Blast \((\d)"/);
    return m ? BLAST_AREA[m[1]] || 1 : 0;
  };

  function rangedFeatures(p) {
    const t = p.traits, txt = p.traitText || '';
    const ammo = (function () { const m = txt.match(/Ammo \((\d)\+\)/); return m ? +m[1] : 0; })();
    return {
      'Strength': typeof p.str === 'number' ? p.str : 0,
      'no Strength': typeof p.str === 'number' ? 0 : 1,
      'AP, per point': -p.ap,
      /* Lethality and Damage are ordered levels, so they are fitted as steps:
         one feature for reaching 2, another for the further step to 3. Each
         coefficient is then the price of that step, and a level's total price is
         the steps below it added up, which cannot fall as the level rises the
         way two independent flags can. */
      'no Lethality': p.lethality === null ? 1 : 0,
      'Lethality, step to 2': p.lethality >= 2 ? 1 : 0,
      'Lethality, step to 3': p.lethality >= 3 ? 1 : 0,
      'Damage, step to 2': t.damage >= 2 ? 1 : 0,
      'Damage, step to 3': t.damage >= 3 ? 1 : 0,
      'Rapid Fire, step to 1': t.rapidFire >= 1 ? 1 : 0,
      'Rapid Fire, step to 2': t.rapidFire >= 2 ? 1 : 0,
      'Rapid Fire, step to 3': t.rapidFire >= 3 ? 1 : 0,
      'Short range, per inch': inches(p.sr),
      'Long range, per inch': inches(p.lr),
      'Template': t.autoHit ? 1 : 0,
      'Blast': blastArea(txt),
      'Ammo, chance of running dry': ammo ? (ammo - 1) / 6 : 0,
      'Unstable': t.unstable ? 1 : 0,
      'Limited': /Limited/.test(txt) ? 1 : 0,
      'Single Shot': /Single Shot/.test(txt) ? 1 : 0,
      'Light': t.light ? 1 : 0,
      'Heavy': t.heavy ? 1 : 0,
      'Toxin': rate(t.toxin),
      'Knockback': rate(t.knockback),
      'Blaze': rate(t.blaze),
      'Web / Gas / Graviton': (t.web || t.gas || t.graviton) ? 1 : 0,
      'other traits': txt.split(',').map(x => x.trim()).filter(x => x &&
        !/^(Ammo|Damage|Rapid Fire|Template|Blast|Unstable|Limited|Single Shot|Light|Heavy|Toxin|Knockback|Blaze|Web|Gas|Graviton Pulse)/.test(x)).length
    };
  }

  function meleeFeatures(p) {
    const t = p.traits, txt = p.traitText || '';
    const sBonus = (function () {
      const m = String(p.str).match(/S\+(\d)/); return m ? +m[1] : 0;
    })();
    /* 'no Strength' is dropped here: the only melee weapons without a Strength
       are the two stilettos, which are also the only ones with Toxin, so the
       two features would be identical columns. */
    return {
      'Strength over S': sBonus,
      'AP, per point': -p.ap,
      'no Lethality': p.lethality === null ? 1 : 0,
      'Lethality, step to 2': p.lethality >= 2 ? 1 : 0,
      'Lethality, step to 3': p.lethality >= 3 ? 1 : 0,
      'Damage, step to 2': t.damage >= 2 ? 1 : 0,
      'Parry': t.parry ? 1 : 0,
      'Paired (X)': t.paired,
      'Unwieldy': t.unwieldy ? 1 : 0,
      'Heavy': t.heavy ? 1 : 0,
      'Breaching': rate(t.breaching),
      'Shock': rate(t.shock),
      'Concussive': rate(t.concussive),
      'Knockback': rate(t.knockback),
      'Shred': rate(t.shred),
      'Toxin': t.toxin ? 1 : 0,
      'Web': t.web ? 1 : 0,
      'other traits': txt.split(',').map(x => x.trim()).filter(x => x &&
        !/^(Melee|Damage|Parry|Paired|Unwieldy|Heavy|Breaching|Shock|Concussive|Knockback|Shred|Toxin|Web)/.test(x)).length
    };
  }

  /* Which features are a trigger rate rather than a flag, and so can be shown
     at each (X+) the price list actually uses. */
  const PARAMETRIC = ['Toxin', 'Knockback', 'Breaching', 'Shock', 'Concussive', 'Blaze'];
  /* Shown at each marker size, scaled by the area it covers. */
  const AREA_SCALED = { 'Blast': [['3\u2033', 1], ['5\u2033', (5 / 3) * (5 / 3)]] };

  /* Ordered levels: a level's price is every step up to it, added together. */
  const STEPPED = {
    'Lethality': ['Lethality, step to 2', 'Lethality, step to 3'],
    'Damage': ['Damage, step to 2', 'Damage, step to 3'],
    'Rapid Fire': ['Rapid Fire, step to 1', 'Rapid Fire, step to 2', 'Rapid Fire, step to 3']
  };
  const STEP_BASE = { 'Lethality': 2, 'Damage': 2, 'Rapid Fire': 1 };

  function observedValues(set, trait) {
    const found = {};
    const re = new RegExp(trait + ' \\((\\d)\\+\\)');
    for (const p of set) {
      const m = (p.traitText || '').match(re);
      if (m) found[+m[1]] = 1;
    }
    return Object.keys(found).map(Number).sort();
  }

  /* Two ways a stat can carry a price. Additive says Template is worth a fixed
     number of credits wherever it lands. Multiplicative fits the log of the
     price, so every coefficient becomes a factor and a trait is worth more on a
     weapon that is already expensive — auto-hitting matters more on a meltagun
     than on a stub gun. Both are fitted and compared on the same footing, in
     credits, so the data decides rather than the choice of model. */
  /* Traits the rules make a drawback. None of them can add to what a weapon is
     worth, whatever the fit says, so their coefficients are held at or below
     zero. Left free they all come out positive, because the price list hangs
     them on its strongest weapons: every Unwieldy weapon is a big two-handed
     thing, so the fit reads Unwieldy as a marker for those weapons rather than
     as a penalty. Holding them down puts that value back on the Strength,
     Lethality and AP it actually belongs to. */
  const DRAWBACKS = ['Ammo, chance of running dry', 'Unstable', 'Heavy', 'Unwieldy',
                     'Limited', 'Single Shot', 'Scarce'];

  /* And the mirror: things the rules make an advantage cannot subtract from
     what a weapon is worth either. Left free, Rapid Fire 1 came out negative. */
  const BENEFITS = ['Strength', 'Strength over S', 'AP, per point', 'Template', 'Blast',
                    'Short range, per inch', 'Long range, per inch', 'Parry', 'Paired (X)', 'Shred',
                    'Toxin', 'Knockback', 'Breaching', 'Shock', 'Concussive', 'Blaze',
                    'Lethality, step to 2', 'Lethality, step to 3',
                    'Damage, step to 2', 'Damage, step to 3',
                    'Rapid Fire, step to 1', 'Rapid Fire, step to 2', 'Rapid Fire, step to 3'];

  /* Left free: 'Light', 'no Strength', 'no Lethality' and 'other traits'. Those
     mark a kind of weapon rather than a good or bad thing, so the data decides. */
  const signOf = (n) => DRAWBACKS.indexOf(n) >= 0 ? -1 : (BENEFITS.indexOf(n) >= 0 ? 1 : 0);

  /* Refit, pinning any drawback that came out positive to zero, until none do.
     A small active-set loop; the design here is far too small to need more. */
  function ridgeSigned(X, y, lambda, names) {
    const p = X[0].length;
    const signs = names.map(signOf);
    const pinned = new Array(p).fill(false);
    let m = null;
    for (let iter = 0; iter <= p; iter++) {
      const keep = [];
      for (let j = 0; j < p; j++) if (!pinned[j]) keep.push(j);
      const sub = X.map(r => keep.map(j => r[j]));
      const fitted = ridge(sub, y, lambda);
      const coef = new Array(p).fill(0);
      keep.forEach((j, k) => { coef[j] = fitted.coef[k]; });
      m = { coef: coef, intercept: fitted.intercept, pinned: pinned.slice() };
      const bad = [];
      for (let j = 0; j < p; j++) {
        if (pinned[j] || !signs[j]) continue;
        if (signs[j] * coef[j] < 0) bad.push(j);   // wrong side of zero
      }
      if (!bad.length) break;
      for (const j of bad) pinned[j] = true;
    }
    /* Recompute the fit statistics against the full design. */
    m.pred = X.map(r => m.intercept + r.reduce((a, v, j) => a + v * m.coef[j], 0));
    const yMean = y.reduce((a, b) => a + b, 0) / y.length;
    const ssRes = y.reduce((a, v, i) => a + (v - m.pred[i]) * (v - m.pred[i]), 0);
    const ssTot = y.reduce((a, v) => a + (v - yMean) * (v - yMean), 0);
    m.r2 = 1 - ssRes / ssTot;
    m.mae = y.reduce((a, v, i) => a + Math.abs(v - m.pred[i]), 0) / y.length;
    return m;
  }

  function fitBoth(X, y, lambda, names) {
    const additive = ridgeSigned(X, y, lambda, names);
    const logged = ridgeSigned(X, y.map(Math.log), lambda, names);
    /* exp() of a fitted log under-predicts the mean, so rescale by the average
       exponentiated residual (Duan's smearing estimate) before comparing. */
    const raw = logged.pred.map(Math.exp);
    const smear = y.reduce((a, v, i) => a + v / raw[i], 0) / y.length;
    logged.predCredits = raw.map(v => v * smear);
    logged.smear = smear;
    logged.maeCredits = y.reduce((a, v, i) => a + Math.abs(v - logged.predCredits[i]), 0) / y.length;
    additive.predCredits = additive.pred;
    additive.maeCredits = additive.mae;
    return { additive: additive, multiplicative: logged };
  }

  /* Build one model from any list of priced profiles. Each needs `creds`, and
     `multiProfile` set where one price buys more than one profile. Exported so
     other work can fit a larger set through exactly this code rather than
     keeping a second copy of it. */
  function model(set, extract) {
    const fit = set.filter(p => !p.multiProfile);
    const names = Object.keys(extract(fit[0]));
    const X = fit.map(p => Object.values(extract(p)));
    const y = fit.map(p => p.creds);
    const both = fitBoth(X, y, LAMBDA, names);
    /* Whichever predicts the actual credit prices more closely leads; the other
       is reported beside it so the choice is visible rather than assumed. */
    const better = both.multiplicative.maeCredits < both.additive.maeCredits
                 ? 'multiplicative' : 'additive';
    const m = both.additive, lg = both.multiplicative;
    const score = (p) => {
      const f = Object.values(extract(p));
      return better === 'multiplicative'
        ? Math.exp(lg.intercept + f.reduce((a, v, j) => a + v * lg.coef[j], 0)) * lg.smear
        : m.intercept + f.reduce((a, v, j) => a + v * m.coef[j], 0);
    };
    const residuals = set.map(p => ({
      name: p.name, cost: p.creds, model: score(p),
      diff: p.creds - score(p), held: !!p.multiProfile
    })).sort((a, b) => a.diff - b.diff);
    /* How many fitted weapons actually carry a feature. A coefficient resting on
       one or two weapons is describing those weapons, not a market price. */
    const support = names.map((n, j) => X.filter(r => r[j] !== 0).length);
    const carrying = (trait, x) => fit.filter(p =>
      new RegExp(trait + ' \\(' + x + '\\+\\)').test(p.traitText || '')).length;

    const shown = [];
    const coefOf = (name) => { const j = names.indexOf(name); return j < 0 ? null : m.coef[j]; };
    const logCoefOf = (name) => { const j = names.indexOf(name); return j < 0 ? 0 : lg.coef[j]; };
    const levelOf = (which, p) => which === 'Lethality' ? p.lethality
                                : which === 'Damage' ? p.traits.damage
                                : p.traits.rapidFire;
    const countAtLeast = (which, level) =>
      fit.filter(p => (levelOf(which, p) || 0) >= level).length;

    for (const family in STEPPED) {
      const base = STEP_BASE[family];
      let running = 0, runningLog = 0;
      STEPPED[family].forEach((step, i) => {
        const c = coefOf(step);
        if (c === null) return;
        running += c;
        runningLog += logCoefOf(step);
        const n = countAtLeast(family, base + i);
        /* Only a level whose running total is nil is being held at the boundary;
           a pinned first step still leaves later levels with a real price. */
        if (n) shown.push({ name: family + ' ' + (base + i), credits: running,
                            factor: Math.exp(runningLog), weapons: n,
                            pinned: Math.abs(running) < 1e-9 });
      });
    }
    const stepNames = [].concat.apply([], Object.keys(STEPPED).map(k => STEPPED[k]));

    names.forEach((n, j) => {
      if (stepNames.indexOf(n) >= 0) return;      // already shown as a level
      if (AREA_SCALED[n]) {
        for (const pair of AREA_SCALED[n]) {
          const carried = fit.filter(p =>
            new RegExp('Blast \\(' + pair[0][0] + '"').test(p.traitText || '')).length;
          if (carried) shown.push({ name: n + ' (' + pair[0] + ')',
                                    credits: m.coef[j] * pair[1],
                                    factor: Math.exp(lg.coef[j] * pair[1]),
                                    weapons: carried, pinned: !!m.pinned[j] });
        }
        return;
      }
      if (PARAMETRIC.indexOf(n) >= 0) {
        const vals = observedValues(set, n);
        if (vals.length) {
          for (const x of vals) {
            shown.push({ name: n + ' (' + x + '+)', credits: m.coef[j] * (7 - x) / 6,
                         factor: Math.exp(lg.coef[j] * (7 - x) / 6),
                         weapons: carrying(n, x), pinned: !!m.pinned[j] });
          }
          return;
        }
      }
      shown.push({ name: n, credits: m.coef[j], factor: Math.exp(lg.coef[j]),
                   weapons: support[j], pinned: !!m.pinned[j] && Math.abs(m.coef[j]) < 1e-9 });
    });
    return {
      n: fit.length, r2: m.r2, mae: m.mae, intercept: m.intercept,
      better: better,
      additiveError: m.maeCredits, multiplicativeError: lg.maeCredits,
      baseline: Math.exp(lg.intercept) * lg.smear,
      coefficients: shown.sort((a, b) => b.credits - a.credits),
      residuals: residuals
    };
  }

  /* Attach the Trading Post price and the multi-profile flag to a profile. */
  function priceUp(p) {
    return Object.assign({}, p, { creds: Data.priceOf(p),
                                  multiProfile: Data.isMultiProfile(p.name) });
  }

  function build(opts) {
    const priced = (list) => {
      const seen = {}, out = [];
      for (const p of list) {
        if (Data.priceOf(p) === undefined || seen[p.name]) continue;
        seen[p.name] = 1; out.push(priceUp(p));
      }
      return out;
    };
    const rangedSet = priced(Data.weapons('ranged', opts));
    const meleeSet = priced(Data.weapons('melee', opts).filter(p => p.traits.melee));
    return {
      ranged: model(rangedSet, rangedFeatures),
      melee: model(meleeSet, meleeFeatures)
    };
  }

  return { build: build, model: model, ridge: ridge, LAMBDA: LAMBDA,
           rangedFeatures: rangedFeatures, meleeFeatures: meleeFeatures,
           DRAWBACKS: DRAWBACKS, BENEFITS: BENEFITS };
})();
if (typeof module !== 'undefined') module.exports = Pricing;
</script>

<script id="ui">
/* ==========================================================================
   UI — builds both calculators from a field spec, recomputes on every change.
   ========================================================================== */
(function () {
  'use strict';

  /* ---- tiny DOM helpers ------------------------------------------------ */
  function el(tag, attrs) {
    const n = document.createElement(tag);
    for (const k in (attrs || {})) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    for (let i = 2; i < arguments.length; i++) {
      const c = arguments[i];
      if (c == null) continue;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  }

  /* opts: array of [value, label] or ['group', name, [[value,label],...]] */
  function field(label, bind, opts, value, hint) {
    const sel = el('select', { 'data-bind': bind, id: 'f-' + bind.replace(/\./g, '-') });
    (function add(list, parent) {
      for (const o of list) {
        if (o[0] === 'group') {
          const g = el('optgroup', { label: o[1] });
          add(o[2], g);
          parent.appendChild(g);
        } else {
          const op = el('option', { value: String(o[0]), text: o[1] });
          if (String(o[0]) === String(value)) op.selected = true;
          parent.appendChild(op);
        }
      }
    })(opts, sel);
    const wrap = el('div', { class: 'f' }, el('label', { for: sel.id, text: label }), sel);
    if (hint) wrap.appendChild(el('p', { class: 'note', text: hint }));
    return wrap;
  }

  function chip(label, bind, checked) {
    const box = el('input', { type: 'checkbox', 'data-bind': bind });
    box.checked = !!checked;
    return el('label', { class: 'chk' }, box, el('span', { text: label }));
  }

  function group(legend) {
    const fs = el('fieldset', {}, el('legend', { text: legend }));
    const g = el('div', { class: 'grid' });
    fs.appendChild(g);
    for (let i = 1; i < arguments.length; i++) if (arguments[i]) g.appendChild(arguments[i]);
    return fs;
  }

  function chipRow() {
    const row = el('div', { class: 'chks' });
    for (let i = 0; i < arguments.length; i++) if (arguments[i]) row.appendChild(arguments[i]);
    return el('div', { class: 'f wide' }, row);
  }

  /* ---- option lists ---------------------------------------------------- */
  const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
  const SKILL = range(2, 6).map(n => [n, n + '+']);
  /* Unstable (p165): a natural 1 to hit turns the shot on the firer. Picking it
     here resolves that hit instead of the shot, so the firer's own risk can be
     read off by putting their profile in the target fields. */
  const BS_SKILL = SKILL.concat([['unstable', 'Unstable — hit on the firer']]);
  const MODS = range(-3, 3).map(n => [n, n > 0 ? '+' + n : String(n)]);
  const SAVE_MODS = range(-2, 2).map(n => [n, n > 0 ? '+' + n : String(n)]);
  const STR = [[0, '- (none)']].concat(range(1, 10).map(n => [n, String(n)]));
  const AP = [[1, '+1'], [0, '- (none)']].concat(range(1, 6).map(n => [-n, '-' + n]));
  const LETH = [[0, '- (traits resolve)']].concat(range(1, 4).map(n => [n, String(n)]));
  const DMG = range(1, 4).map(n => [n, String(n)]);
  const RF = [[0, 'none']].concat(range(1, 3).map(n => [n, 'Rapid Fire (' + n + ')']));
  const XPLUS = [[0, 'off']].concat(range(2, 6).map(n => [n, n + '+']));
  const SAVE = [[0, 'none']].concat(range(2, 6).map(n => [n, n + '+']));
  const T_OPTS = range(1, 10).map(n => [n, String(n)]);
  const W_OPTS = range(1, 10).map(n => [n, String(n)]);
  const ATTACKS = range(1, 6).map(n => [n, String(n)]);
  const STATUS = [['active', 'Active'], ['injured', 'Injured (0 wounds)'], ['seriously', 'Seriously Injured']];
  const MELEE_STR = [['S', 'S (wielder)'], ['S+1', 'S+1'], ['S+2', 'S+2'], ['S+3', 'S+3'],
                     [0, '- (none)']].concat(range(1, 10).map(n => [n, String(n)]));
  const RANGE_BAND = [[0, 'none'], [1, '+1 (within short range)'], [2, '+2 (within long range)']];

  function weaponOpts(list) {
    const cats = [];
    for (const p of list) {
      let c = cats.find(x => x[1] === p.cat);
      if (!c) { c = ['group', p.cat, []]; cats.push(c); }
      c[2].push([p.name, p.name]);
    }
    return [['', 'Pick a profile...']].concat(cats);
  }
  const FIGHTER_OPTS = [['', 'Pick a profile...'],
    ['group', 'From the core rules', Data.fighters.filter(f => f.book).map(f => [f.name, f.name])],
    ['group', 'Common fighter types', Data.fighters.filter(f => !f.book).map(f => [f.name, f.name])]];

  /* ---- trait bookkeeping ------------------------------------------------
     Traits the calculator actually uses, so the rest can be named plainly
     rather than silently dropped. */
  const MODELLED = ['Rapid Fire', 'Toxin', 'Rending', 'Shred', 'Breaching', 'Shock',
    'Blaze', 'Gas', 'Web', 'Flash', 'Graviton Pulse', 'Damage', 'Template', 'Light',
    'Melee', 'Paired', 'Blast'];

  function splitTraits(text) {
    return (text || '').split(',').map(s => s.trim()).filter(Boolean);
  }
  function unmodelled(text) {
    return splitTraits(text).filter(t => !MODELLED.some(m => t.indexOf(m) === 0));
  }

  /* ---- panels ----------------------------------------------------------- */
  const pct = (x) => {
    if (x <= 0) return '0%';
    if (x < 0.001) return '<0.1%';
    if (x > 0.999 && x < 1) return '>99.9%';
    return (x * 100).toFixed(1) + '%';
  };

  const LABELS = { fleshWound: 'Flesh wound', serious: 'Serious injury', outOfAction: 'Out of action' };

  function resultsBlock() {
    const mk = (cls, key) => el('div', { class: 'odd ' + cls },
      el('div', { class: 'v', 'data-out': key, text: '0%' }),
      el('div', { class: 'k', text: LABELS[key] }));
    const bar = el('div', { class: 'bar' });
    for (const k of ['unharmed', 'wounded', 'fleshWound', 'serious', 'outOfAction']) {
      bar.appendChild(el('i', { 'data-seg': k, style: 'width:0' }));
    }
    return el('div', { class: 'results' },
      el('div', { class: 'odds' }, mk('flesh', 'fleshWound'), mk('serious', 'serious'), mk('ooa', 'outOfAction')),
      bar,
      el('div', { class: 'minor', 'data-minor': '1' }),
      el('div', { class: 'warn hidden', 'data-warn': '1' }),
      el('div', { class: 'info hidden', 'data-notes': '1' }));
  }

  function weaponFields(prefix, melee) {
    return group(melee ? (prefix === 'w1' ? 'Primary weapon' : 'Secondary weapon') : 'Weapon profile',
      field('Strength', prefix + '.str', melee ? MELEE_STR : STR, melee ? 'S' : 4),
      field('Armour Piercing', prefix + '.ap', AP, 0),
      field('Lethality', prefix + '.lethality', LETH, 1),
      field('Damage (X)', prefix + '.damage', DMG, 1),
      melee ? null : field('Rapid Fire (X)', prefix + '.rapidFire', RF, 0),
      field('Toxin (X+)', prefix + '.toxin', XPLUS, 0),
      field('Rending (X+)', prefix + '.rending', XPLUS, 0),
      field('Shred (X+)', prefix + '.shred', XPLUS, 0),
      field('Breaching (X+)', prefix + '.breaching', XPLUS, 0),
      field('Shock (X+)', prefix + '.shock', XPLUS, 0),
      field('Blaze (X+)', prefix + '.blaze', XPLUS, 0),
      chipRow(
        chip('Template (hits automatically)', prefix + '.autoHit', false),
        melee ? null : chip('Blast (scatters on a miss)', prefix + '.blast', false),
        chip('Gas', prefix + '.gas', false),
        chip('Web', prefix + '.web', false),
        chip('Flash', prefix + '.flash', false),
        chip('Graviton Pulse', prefix + '.graviton', false),
        melee ? chip('+1 Strength (Backstab / Lance)', prefix + '.strBonus', false) : null,
        melee ? chip('Light (one attack only)', prefix + '.light', false) : null
      ));
  }

  function targetFields(melee) {
    return group('Target',
      field('Toughness', 't.T', T_OPTS, 3),
      field('Wounds remaining', 't.W', W_OPTS, 1),
      field('Save', 't.sv', SAVE, 6),
      field('Invulnerable save', 't.inv', SAVE, 0),
      field('Status', 't.status', STATUS, 'active'),
      melee ? null : field('Cover / range save modifier', 't.rangeBand', RANGE_BAND, 0),
      field('Other save modifier', 't.saveOther', SAVE_MODS, 0),
      field('Initiative (for Flash)', 't.initiative', T_OPTS, 4),
      field('Strength (for Graviton Pulse)', 't.strength', T_OPTS, 3),
      chipRow(
        chip('Respirator', 't.respirator', false),
        melee ? chip('Parry weapon (+1 Sv)', 't.parry', false) : chip('Shield (+1 Sv vs shooting)', 't.shield', false),
        melee ? chip('Mesh armour (+1 Sv in close combat)', 't.mesh', false) : null
      ));
  }

  function assumptionsBlock(extra) {
    const body = el('div', { class: 'body' });
    body.appendChild(el('p', { html:
      'A fighter reduced to zero Wounds is resolved on the <b>Injury dice</b>: ' +
      '1-2 Flesh Wound, 3-5 Seriously Injured, 6 Out of Action.' }));
    body.appendChild(el('p', { html:
      '<b>Flesh wound</b> is the result the rules text prints as <b>Injured</b> (p77): no further damage, ' +
      'but the model is left on zero Wounds and gains no benefit from its skills.' }));
    body.appendChild(el('p', { html:
      'The attacker rolls Lethality Injury dice and <b>selects one</b> (p77), so the best available result is taken. ' +
      'Save rolls of a natural 1 or 2 always fail (p76). A shot beyond Long Range is an automatic miss (p72) and is ' +
      'not offered as an input. Rapid Fire assumes the maximum X Firepower dice are rolled.' }));
    body.appendChild(el('p', { html:
      'Nothing here is rolled or sampled — every figure is worked out exactly by enumerating the dice.' }));
    if (extra) body.appendChild(el('p', { html: extra }));
    body.appendChild(el('p', { html:
      '<b>Blast scatter.</b> A missed Blast shot scatters D6" in the direction of the Scatter dice ' +
      '(1-4 Arrow, 5-6 Hit with arrow). <b>A scatter of 1" or 2" counts as a hit</b>, because the ' +
      'marker still covers the target; 3" or more misses it. A Hit symbol alongside a 1 is a misfire ' +
      'and centres the marker on the firer (p162). Blast markers catching other models, and the ' +
      'extra markers a Rapid Fire Blast weapon would throw, are outside a one-target calculation.' }));
    body.appendChild(el('p', { html:
      '<b>Not modelled:</b> running out of ammo and jams, Knockback, Concussive, Drag, Rad-phage, ' +
      'Cursed, Reckless, Smoke, Twin-linked, Stray Shots, Target Priority, Nerve checks, Initiative order and ' +
      'return attacks, skills, and the Lasting Injury table.' }));
    return el('details', {}, el('summary', { text: 'Assumptions and what is left out' }), body);
  }

  function buildRanged(root) {
    root.appendChild(resultsBlock());
    root.appendChild(group('Load a profile',
      field('Weapon', 'pick.weapon', weaponOpts(Data.ranged), ''),
      field('Target', 'pick.fighter', FIGHTER_OPTS, ''),
      el('p', { class: 'profile', 'data-profile': '1' })));
    root.appendChild(group('Attacker',
      field('Ballistic Skill', 'a.skill', BS_SKILL, 4),
      field('Other hit modifiers', 'a.hitMod', MODS, 0,
        '-1 for a Seriously Injured target is applied for you.')));
    root.appendChild(weaponFields('w1', false));
    root.appendChild(targetFields(false));
    root.appendChild(assumptionsBlock(
      'The save modifier for short and long range is transcribed from p76 as printed, where it sits under a ' +
      'heading of "Cover". A +1 save at short range reads oddly, so check it against your book; the free ' +
      '"other save modifier" is there if your reading differs.'));
  }

  function buildMelee(root) {
    root.appendChild(resultsBlock());
    root.appendChild(group('Load a profile',
      field('Primary weapon', 'pick.weapon', weaponOpts(Data.melee), ''),
      field('Secondary weapon', 'pick.weapon2', weaponOpts(Data.melee), ''),
      field('Attacker', 'pick.fighter', FIGHTER_OPTS, ''),
      field('Target', 'pick.fighter2', FIGHTER_OPTS, ''),
      el('p', { class: 'profile', 'data-profile': '1' })));
    root.appendChild(group('Attacker',
      field('Weapon Skill', 'a.skill', SKILL, 4),
      field('Strength', 'a.S', T_OPTS, 3),
      field('Attacks', 'a.A', ATTACKS, 1),
      field('Paired (X)', 'a.paired', [[0, 'off'], [1, '+1'], [2, '+2']], 0),
      field('Other hit modifiers', 'a.hitMod', MODS, 0),
      chipRow(
        chip('Charged (+1 attack)', 'a.charge', false),
        chip('Reacting, not activating (1 attack)', 'a.reacting', false),
        chip('Assist (+1 to hit)', 'a.assist', false),
        chip('Interference (-1 to hit)', 'a.interference', false),
        chip('Target was out of sight when declared (-1)', 'a.blind', false),
        chip('Use a secondary weapon (1 extra attack)', 'a.useSecondary', false)
      )));
    root.appendChild(weaponFields('w1', true));
    const second = weaponFields('w2', true);
    second.setAttribute('data-only', 'secondary');
    root.appendChild(second);
    root.appendChild(targetFields(true));
    root.appendChild(assumptionsBlock(
      'Attacks are resolved one dice at a time, in order, so the target\'s wounds and condition carry from ' +
      'one attack to the next. Initiative order is not modelled, so this is the attacker\'s side of the ' +
      'combat only — it does not ask whether the target strikes back.'));
  }

  /* ---- state ------------------------------------------------------------ */
  function readState(root) {
    const st = {};
    root.querySelectorAll('[data-bind]').forEach(node => {
      const path = node.getAttribute('data-bind').split('.');
      let cur = st;
      for (let i = 0; i < path.length - 1; i++) cur = (cur[path[i]] = cur[path[i]] || {});
      let v;
      if (node.type === 'checkbox') v = node.checked;
      else { v = node.value; if (/^-?\d+$/.test(v)) v = parseInt(v, 10); }
      cur[path[path.length - 1]] = v;
    });
    return st;
  }

  function setControl(root, bind, value) {
    const node = root.querySelector('[data-bind="' + bind + '"]');
    if (!node) return;
    if (node.type === 'checkbox') node.checked = !!value;
    else node.value = String(value);
  }

  /* Fill the dropdowns from a picked weapon profile (p154-157). */
  function applyWeapon(root, prefix, profile, melee) {
    const t = profile.traits;
    setControl(root, prefix + '.str', profile.str === null ? 0 : profile.str);
    setControl(root, prefix + '.ap', profile.ap);
    setControl(root, prefix + '.lethality', profile.lethality === null ? 0 : profile.lethality);
    setControl(root, prefix + '.damage', t.damage);
    if (!melee) setControl(root, prefix + '.rapidFire', t.rapidFire);
    for (const k of ['toxin', 'rending', 'shred', 'breaching', 'shock', 'blaze']) {
      setControl(root, prefix + '.' + k, t[k]);
    }
    for (const k of ['autoHit', 'gas', 'web', 'flash', 'graviton']) {
      setControl(root, prefix + '.' + k, t[k]);
    }
    if (!melee) setControl(root, prefix + '.blast', t.blast);
    if (melee) {
      setControl(root, prefix + '.light', t.light);
      setControl(root, prefix + '.strBonus', false);
      if (prefix === 'w1') setControl(root, 'a.paired', t.paired);
    }
  }

  function applyFighter(root, f, asTarget, melee) {
    if (asTarget) {
      setControl(root, 't.T', f.T);
      setControl(root, 't.W', f.W);
      setControl(root, 't.sv', f.sv);
      setControl(root, 't.initiative', f.I);
      setControl(root, 't.strength', f.S);
    } else {
      setControl(root, 'a.skill', melee ? f.ws : f.bs);
      setControl(root, 'a.S', f.S);
      setControl(root, 'a.A', f.A);
    }
  }

  /* ---- assembling engine input ------------------------------------------ */


  function targetInput(st, melee) {
    const t = st.t;
    let mods = Number(t.saveOther) || 0;
    if (!melee) {
      mods += Number(t.rangeBand) || 0;
      if (t.shield) mods += 1;
    } else {
      if (t.parry) mods += 1;
      if (t.mesh) mods += 1;
    }
    return {
      T: t.T, W: t.W, sv: t.sv, inv: t.inv, saveMods: mods, status: t.status,
      initiative: t.initiative, strength: t.strength,
      respirator: !!t.respirator
    };
  }

  function weaponInput(w, attackerS) {
    let str = w.str;
    if (typeof str === 'string' && str[0] === 'S') {
      str = attackerS + (str.length > 1 ? parseInt(str.slice(1), 10) : 0);
    }
    if (w.strBonus) str = (str || 0) + 1;
    return {
      str: str ? str : null, ap: Number(w.ap) || 0,
      lethality: Number(w.lethality) || 0, damage: Number(w.damage) || 1,
      rapidFire: Number(w.rapidFire) || 0,
      toxin: Number(w.toxin) || 0, rending: Number(w.rending) || 0,
      shred: Number(w.shred) || 0, breaching: Number(w.breaching) || 0,
      shock: Number(w.shock) || 0, blaze: Number(w.blaze) || 0,
      gas: !!w.gas, web: !!w.web, flash: !!w.flash, graviton: !!w.graviton,
      autoHit: !!w.autoHit, blast: !!w.blast, unstable: false
    };
  }

  /* The profile line as the Trading Post prints it, so a filled-in form can
     be checked against p154-157 at a glance. */
  function profileLine(p) {
    const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const bits = [
      p.sr + (p.lr && p.lr !== '-' ? '/' + p.lr : ''),
      'Str ' + (p.str === null ? '-' : p.str),
      'AP ' + (p.ap ? (p.ap > 0 ? '+' + p.ap : p.ap) : '-'),
      'L ' + (p.lethality === null ? '-' : p.lethality)
    ];
    if (p.traitText) bits.push(p.traitText);
    return '<b>' + esc(p.name) + '</b> \u00b7 ' + bits.map(esc).join(' \u00b7 ');
  }

  /* ---- rendering results ------------------------------------------------ */
  function show(root, res, notes) {
    for (const k of ['fleshWound', 'serious', 'outOfAction']) {
      root.querySelector('[data-out="' + k + '"]').textContent = pct(res[k]);
    }
    for (const k of ['unharmed', 'wounded', 'fleshWound', 'serious', 'outOfAction']) {
      const seg = root.querySelector('[data-seg="' + k + '"]');
      seg.style.width = (res[k] * 100).toFixed(2) + '%';
      seg.style.background = { unharmed: 'var(--panel-2)', wounded: 'var(--ok)',
        fleshWound: 'var(--flesh)', serious: 'var(--serious)', outOfAction: 'var(--ooa)' }[k];
    }
    const bits = ['Unharmed <b>' + pct(res.unharmed) + '</b>'];
    if (res.wounded > 0) bits.push('Wounded, still standing <b>' + pct(res.wounded) + '</b>');
    bits.push(
      'At least one hit <b>' + pct(res.pHit) + '</b>',
      'Expected hits <b>' + res.expectedHits.toFixed(2) + '</b>',
      (notes.twoWeapons ? 'A primary hit wounds <b>' : 'A hit wounds <b>') + pct(res.perHit.pWound) + '</b>',
      'A wound beats the save <b>' + pct(res.perHit.pWound ? res.perHit.pUnsaved / res.perHit.pWound : 0) + '</b>');
    if (res.scatterHit > 0) bits.push('...of which by scatter <b>' + pct(res.scatterHit) + '</b>');
    if (res.webbed > 0) bits.push('Webbed <b>' + pct(res.webbed) + '</b>');
    if (res.blinded > 0) bits.push('Blinded <b>' + pct(res.blinded) + '</b>');
    root.querySelector('[data-minor]').innerHTML = bits.join(' · ');

    const paint = (sel, lines) => {
      const box = root.querySelector(sel);
      box.innerHTML = lines.map(t => '<p>' + t + '</p>').join('');
      box.classList.toggle('hidden', lines.length === 0);
    };
    paint('[data-warn]', res.problems);
    paint('[data-notes]', notes);
  }

  /* ---- wiring ----------------------------------------------------------- */
  function wire(root, melee) {
    let lastPick = { weapon: '', weapon2: '', fighter: '', fighter2: '' };

    function recompute(fromPicker) {
      const st = readState(root);

      // A picker only fills fields in; after that every field stays editable.
      /* Look the pick up in whatever list is currently on offer, so a gang
         weapon fills the fields exactly as a Trading Post one does. */
      const offered = () => Data.weapons(melee ? 'melee' : 'ranged', scope);
      if (st.pick.weapon && st.pick.weapon !== lastPick.weapon) {
        const p = offered().find(x => x.name === st.pick.weapon);
        if (p) applyWeapon(root, 'w1', p, melee);
      }
      if (melee && st.pick.weapon2 && st.pick.weapon2 !== lastPick.weapon2) {
        const p = offered().find(x => x.name === st.pick.weapon2);
        if (p) { applyWeapon(root, 'w2', p, true); setControl(root, 'a.useSecondary', true); }
      }
      if (st.pick.fighter && st.pick.fighter !== lastPick.fighter) {
        const f = Data.fighters.find(x => x.name === st.pick.fighter);
        if (f) applyFighter(root, f, !melee, melee);
      }
      if (melee && st.pick.fighter2 && st.pick.fighter2 !== lastPick.fighter2) {
        const f = Data.fighters.find(x => x.name === st.pick.fighter2);
        if (f) applyFighter(root, f, true, true);
      }
      lastPick = { weapon: st.pick.weapon, weapon2: st.pick.weapon2,
                   fighter: st.pick.fighter, fighter2: st.pick.fighter2 };

      const s = readState(root);
      const target = targetInput(s, melee);
      const faces = Engine.INJURY_DICE;
      const notes = [];
      const selfHit = !melee && s.a.skill === 'unstable';
      let res;

      if (!melee) {
        const w = weaponInput(s.w1, 0);
        if (selfHit) {
          // One automatic Hit from this weapon's own profile: no hit roll, so no
          // Firepower dice and no Blast marker to scatter.
          w.autoHit = true; w.rapidFire = 0; w.blast = false;
        }
        res = Engine.computeRanged({
          skill: selfHit ? 4 : s.a.skill, hitMod: selfHit ? 0 : s.a.hitMod,
          weapon: w, target: target, faces: faces });
        if (selfHit) notes.push(
          '<b>Unstable, hit on the firer.</b> These odds are for the single automatic Hit the ' +
          'firing model takes from this weapon\u2019s own profile — one confirmed hit, with no hit ' +
          'roll and no Firepower dice, however much Rapid Fire the weapon has (p165). ' +
          'Put the <b>firer\u2019s</b> own Toughness, Wounds and saves in the target fields below. ' +
          'It happens on a natural 1 to hit, so across all shots fired that is ' +
          pct(res.fleshWound / 6) + ' flesh wound, ' + pct(res.serious / 6) + ' serious injury and ' +
          pct(res.outOfAction / 6) + ' out of action.');
        if (w.rapidFire > 0) notes.push('Rapid Fire (' + w.rapidFire + '): assumes all ' + w.rapidFire +
          ' Firepower dice are rolled. Running out of ammo is not tracked.');
        if (w.autoHit && !selfHit) notes.push('Template: the target is hit automatically, so hit modifiers and Shock (X+) never come into it.');
        if (w.blast && !w.autoHit) notes.push(
          '<b>Blast: a scatter of 1" or 2" is counted as a hit.</b> A missed shot scatters D6" ' +
          'in a random direction, and a 3" or 5" marker that moves only 1" or 2" still covers the ' +
          'model it was aimed at. That is ' + pct(Engine.SCATTER_COVERS) + ' of missed shots, or ' +
          pct(res.scatterHit) + ' of all shots. A 1" scatter on the crosshair face is a misfire ' +
          'and centres the marker on the firer instead: ' + pct(res.misfire) + ' of all shots.');
      } else {
        const sec = !!s.a.useSecondary;
        const dice = s.a.reacting ? 1 : (s.a.A + (s.a.charge ? 1 : 0) + (Number(s.a.paired) || 0));
        const hitMod = (Number(s.a.hitMod) || 0) + (s.a.assist ? 1 : 0) -
                       (s.a.interference ? 1 : 0) - (s.a.blind ? 1 : 0);
        root.querySelector('[data-only="secondary"]').classList.toggle('hidden', !sec);
        const primary = weaponInput(s.w1, s.a.S);
        const weapons = [{ weapon: primary, attacks: s.w1.light ? 1 : dice, skill: s.a.skill, hitMod: hitMod }];
        if (sec) weapons.push({ weapon: weaponInput(s.w2, s.a.S), attacks: 1, skill: s.a.skill, hitMod: hitMod });
        res = Engine.computeMelee({ weapons: weapons, target: target, faces: faces });
        notes.twoWeapons = sec;
        notes.push('Attack dice: ' + weapons[0].attacks + ' with the primary weapon' +
          (sec ? ' and 1 with the secondary' : '') + '.');
        if (s.w1.light && dice > 1) notes.push('Light: only one attack may ever be made with it, however many Attack dice the fighter has (p163).');
      }

      const picked = offered().find(x => x.name === s.pick.weapon);
      const picked2 = melee ? offered().find(x => x.name === s.pick.weapon2) : null;
      const line = root.querySelector('[data-profile]');
      const lines = [];
      if (picked) lines.push(profileLine(picked));
      if (picked2 && s.a.useSecondary) lines.push(profileLine(picked2));
      line.innerHTML = lines.join('<br>');
      line.classList.toggle('hidden', lines.length === 0);
      const inPlay = lines.length === 2 ? [picked, picked2] : (picked ? [picked] : []);
      if (inPlay.length) {
        const left = [];
        for (const p of inPlay) {
          for (const tr of unmodelled(p.traitText)) {
            // In self-hit mode Unstable is the whole calculation, not something left out.
            if (selfHit && tr.indexOf('Unstable') === 0) continue;
            if (left.indexOf(tr) < 0) left.push(tr);
          }
        }
        if (left.length) notes.push('Not part of this calculation: ' + left.join(', ') + '.');
        if (inPlay.some(p => p.traits.smoke)) notes.push('Smoke: a model hit by it is never wounded and is not Suppressed (p165), so there is nothing to work out.');
        if (inPlay.some(p => p.traits.unstable) && s.a.skill !== 'unstable') notes.push(
          'Unstable: on a natural 1 to hit, the firer takes a hit from this profile instead — 1 in 6 (p165). ' +
          'Pick <b>Unstable</b> in the Ballistic Skill list to work out what that hit does to them.');
      }
      if (target.status !== 'active') {
        notes.push(target.status === 'seriously'
          ? 'The target already starts Seriously Injured, so "serious injury" includes leaving them exactly as they are, and a Serious Injury result does nothing (p77).'
          : 'The target starts on 0 wounds and Injured, so "flesh wound" includes leaving them exactly as they are.');
      }
      show(root, res, notes);
    }

    root.addEventListener('change', recompute);
    root.addEventListener('input', recompute);
    recompute();
  }

  /* ---- value panel -------------------------------------------------------
     What the Trading Post charges per stat, fitted from its own price list.
     This says nothing about how good a weapon is — only what it is billed at. */
  function table(head, rows) {
    const t = el('table', { class: 'val' });
    const tr = el('tr');
    for (const h of head) tr.appendChild(el('th', { text: h }));
    t.appendChild(tr);
    for (const r of rows) {
      const row = el('tr');
      for (const c of r) {
        row.appendChild(el('td', { class: c.cls || '', text: c.text !== undefined ? c.text : c }));
      }
      t.appendChild(row);
    }
    return t;
  }

  const credits = (x) => (x >= 0 ? '+' : '\u2212') + Math.abs(x).toFixed(1);
  const whole = (x) => (x >= 0 ? '+' : '\u2212') + Math.round(Math.abs(x));

  function standouts(model, best) {
    const fitted = model.residuals.filter(r => !r.held);
    const rows = (best ? fitted.slice(0, 8) : fitted.slice(-8).reverse());
    const tp = (n) => {
      const v = Data.tradePoints[n];
      return v === undefined ? '\u2014' : (v === 0 ? '0' : String(v));
    };
    return table(['Weapon', 'Costs', 'TP', 'Worth', 'Difference'], rows.map(r => [
      r.name,
      { text: r.cost + 'c', cls: 'n' },
      { text: tp(r.name), cls: 'n dim' },
      { text: Math.round(r.model) + 'c', cls: 'n' },
      { text: whole(r.diff) + 'c', cls: 'n ' + (r.diff < 0 ? 'good' : 'bad') }
    ]));
  }

  function section(title, node) {
    return el('fieldset', {}, el('legend', { text: title }), node);
  }

  function buildValue(root, opts) {
    const M = Pricing.build(opts);

    root.appendChild(el('p', { class: 'sub',
      text: 'What the Trading Post charges for each stat, worked out from its own price list. ' +
            'This is about prices, not about how good a weapon is.' }));

    for (const [label, m] of [['Ranged', M.ranged], ['Close combat', M.melee]]) {
      root.appendChild(section(label + ' \u2014 best value', standouts(m, true)));
      root.appendChild(section(label + ' \u2014 worst value', standouts(m, false)));
      const flat = m.better === 'additive';
      const fit = el('p', { class: 'fitline', html:
        'Fitted on <b>' + m.n + '</b> weapons. Charging a <b>flat rate</b> per stat misses by ' +
        '<b>\u00b1' + m.additiveError.toFixed(1) + 'c</b>; treating each stat as a <b>multiplier</b> ' +
        'misses by <b>\u00b1' + m.multiplicativeError.toFixed(1) + 'c</b>. ' +
        'The price list is <b>' + (flat ? 'closer to flat rates' : 'closer to multipliers') +
        '</b>, so the credit figures lead and the \u00d7 column is the alternative fit.' });
      const coef = section(label + ' \u2014 what the market charges',
        table(['Feature', 'Credits', '\u00d7', 'Weapons'], m.coefficients.map(c => [
          c.name,
          { text: c.pinned ? 'held at 0' : credits(c.credits),
            cls: 'n ' + (c.pinned ? 'dim' : c.credits < 0 ? 'good' : '') },
          { text: '\u00d7' + c.factor.toFixed(2), cls: 'n dim' },
          { text: String(c.weapons), cls: 'n' + (c.weapons <= 2 ? ' thin' : '') }])));
      coef.insertBefore(fit, coef.childNodes[1]);
      root.appendChild(coef);
    }

    const body = el('div', { class: 'body' });
    body.appendChild(el('p', { html:
      'Each weapon\u2019s price is fitted against its stat line, so a coefficient reads as ' +
      '<i>the market adds about this many credits per unit, holding the rest of the profile ' +
      'fixed</i>. With only ~40 weapons, treat the sign and rough size as the signal and the ' +
      'decimals as noise.' }));
    body.appendChild(el('p', { html:
      '<b>More of a good thing never prices for less here.</b> Traits written (X+) are fitted ' +
      'as how often they fire, so Breaching (5+) is worth exactly twice Breaching (6+), and a ' +
      'Blaze (4+) would price above Blaze (5+) if the list carried one. Lethality and Damage ' +
      'are fitted as steps \u2014 the price of reaching 2, then the further step to 3 \u2014 so a level ' +
      'is every step below it added up and cannot come out under the level beneath it.' }));
    body.appendChild(el('p', { html:
      '<b>Blast is priced by the ground it covers.</b> A 5\u2033 marker takes in (5/3)\u00b2 of a 3\u2033 one, ' +
      'so that ratio is set and only its scale is fitted. Left as two free flags the fit put the ' +
      '5\u2033 marker <i>below</i> the 3\u2033: four weapons carry it, all grenades, so the figure chased ' +
      'what grenades cost rather than what the marker is worth.' }));
    body.appendChild(el('p', { html:
      '<b>Flat rates or multipliers?</b> A trait plausibly ought to be worth more on a weapon ' +
      'that is already good \u2014 auto-hitting matters more on a meltagun than on a stub gun \u2014 which ' +
      'would make each stat a multiplier rather than a fixed number of credits. Both were fitted ' +
      'and compared on the same footing, by how closely each predicts the actual prices in ' +
      'credits. <b>The flat rate wins, and not narrowly.</b> The price list charges much the same ' +
      'for a stat wherever it lands, even though its value in play plainly does not work that ' +
      'way. The \u00d7 column shows what the multiplier fit said, for comparison.' }));
    body.appendChild(el('p', { html:
      'The one hint the other way is <b>Template</b>: across the seven weapons carrying it, the ' +
      'flat rate under-prices the dear ones and over-prices the cheap ones, which is what a ' +
      'multiplier would look like. Seven weapons is not enough to act on, and the whole-list ' +
      'comparison points the other way, so it stays an observation rather than a change.' }));
    body.appendChild(el('p', { html:
      '<b>Credits are only half the price.</b> The Trading Post also charges <b>Trade Points</b>, ' +
      'shown in the TP column, and they run from 0 on a lasgun to 4 on a meltagun or grav gun \u2014 ' +
      'so the weapons that cost the most credits generally cost the most of the scarcer currency ' +
      'too. None of the figures on this page price that in, because TP is not denominated in ' +
      'credits and there is no exchange rate to read off the list.' }));
    body.appendChild(el('p', { html:
      '<b>That is the real House advantage.</b> A gang buying from its own list pays credits ' +
      'alone. A Van Saar Tek takes a las carbine for 20 credits and no Trade Points; the same ' +
      'gang reaching for a meltagun through the Trading Post pays 140 credits <i>and</i> 4 TP. ' +
      'Where a weapon appears on both, the credit price is identical \u2014 108 such prices across ' +
      'five House lists, every one matching \u2014 so the whole of the house discount is the Trade ' +
      'Points it does not charge, plus getting the thing at all.' }));
    body.appendChild(el('p', { html:
      'The <b>Weapons</b> column is how many weapons carry each feature. A figure resting on ' +
      'one or two is describing those weapons rather than a market rate \u2014 read it as an ' +
      'observation about the meltagun, not as the price of Damage (3).' }));
    body.appendChild(el('p', { html:
      '<b>The drawbacks are a balance mechanic, not a price.</b> Left free, every one of them ' +
      'came out as a <i>premium</i>: Ammo (5+) and (6+) weapons average a point more Strength, ' +
      'a point more AP and half a step more Lethality than weapons with no Ammo trait, and ' +
      'every Unwieldy weapon is a big two-handed thing. The cause runs the opposite way to what ' +
      'a fit assumes \u2014 the weapon is not dear because it jams, it jams <i>because</i> it is ' +
      'strong, and the drawback was hung on it as a counterweight. So the fit reads those ' +
      'traits as labels for powerful weapons and prices them accordingly.' }));
    body.appendChild(el('p', { html:
      'That being so, <b>a drawback is never allowed to add credits here, and an advantage is ' +
      'never allowed to subtract them.</b> Ammo, Unstable, Heavy, Unwieldy, Limited, Single ' +
      'Shot and Scarce are held at or below zero; Strength, AP, Lethality, Damage, Rapid Fire, ' +
      'Template, Blast and the (X+) benefits at or above it. Anything marked <b>held at 0</b> ' +
      'hit that boundary, and the value it was absorbing has gone back onto the stats it was ' +
      'standing in for.' }));
    body.appendChild(el('p', { html:
      'That costs a little accuracy \u2014 the flat-rate error rises from about 4.3c to 4.7c on ' +
      'ranged weapons \u2014 and buys a model that cannot tell you a penalty is worth paying for. ' +
      'It does not make the drawbacks free. Their price cannot be read off a list that never ' +
      'sells the same weapon with and without them, but in play the cost is real and large: ' +
      'Ammo (6+) takes roughly 45% of a weapon\u2019s firing uptime. <b>Light</b> and ' +
      '<b>Limited</b> are left free to fall either way and both settle negative on their own, ' +
      'because for those the list does carry matched pairs.' }));
    body.appendChild(el('p', { html:
      '<b>Where matched pairs exist, trust them over the fit.</b> Rapid Fire is the clearest ' +
      'case: the autogun costs 5c more than the lasgun and the autopistol 5c more than the ' +
      'stub gun, each pair otherwise alike but for the extra die and a little short range. ' +
      'So the first Rapid Fire die is worth about <b>+5c</b>, even though the whole-list fit ' +
      'pushes it to its boundary \u2014 there it is tangled up with the auto and bolt families and ' +
      'with Ammo, which is held at zero. The Rapid Fire 2 figure rests on two weapons, both ' +
      'Heavy, so it is carrying some of what Heavy would have taken.' }));
    body.appendChild(el('p', { html:
      'Shotgun ammo types and grenade launcher rounds are left out: one price buys several ' +
      'profiles, so scoring one of them understates what the credits bought. Trading Post ' +
      'prices only (p154\u2013157) \u2014 gang equipment lists price some weapons differently.' }));
    root.appendChild(el('details', {}, el('summary', { text: 'How this is worked out, and what it cannot tell you' }), body));
  }

  /* ---- which weapons are on offer ----------------------------------------
     The Trading Post alone by default. Gang list weapons are off unless asked
     for, so the pickers are not swamped by kit most gangs cannot buy. */
  const scope = { includeGang: false, gang: 'all' };

  function repopulate(sel, list, keepValue) {
    const cats = [];
    for (const p of list) {
      let c = cats.find(x => x.name === p.cat);
      if (!c) { c = { name: p.cat, items: [] }; cats.push(c); }
      c.items.push(p.name);
    }
    sel.innerHTML = '';
    sel.appendChild(el('option', { value: '', text: 'Pick a profile...' }));
    for (const c of cats) {
      const g = el('optgroup', { label: c.name });
      for (const n of c.items) g.appendChild(el('option', { value: n, text: n }));
      sel.appendChild(g);
    }
    if (keepValue && list.some(p => p.name === keepValue)) sel.value = keepValue;
  }

  function applyScope() {
    for (const [root, kind, binds] of [[rangedRoot, 'ranged', ['pick.weapon']],
                                       [meleeRoot, 'melee', ['pick.weapon', 'pick.weapon2']]]) {
      const list = Data.weapons(kind, scope);
      for (const b of binds) {
        const sel = root.querySelector('[data-bind="' + b + '"]');
        if (sel) repopulate(sel, list, sel.value);
      }
      root.dispatchEvent(new Event('change'));
    }
    valueRoot.innerHTML = '';
    buildValue(valueRoot, scope);

    const n = Data.gangRanged.length + Data.gangMelee.length;
    const shown = scope.includeGang
      ? (scope.gang === 'all' ? n
         : Data.gangRanged.concat(Data.gangMelee).filter(w => w.gang === scope.gang).length)
      : 0;
    document.getElementById('opt-note').textContent = scope.includeGang
      ? 'Showing the Trading Post plus ' + shown + ' weapon' + (shown === 1 ? '' : 's') +
        ' the ' + (scope.gang === 'all' ? 'House lists' : scope.gang + ' list') +
        ' sell that it does not. Both price the same weapons alike, so the two mix safely.'
      : 'Trading Post only. Tick the box to add weapons sold on the House gang lists.';
  }

  /* ---- boot -------------------------------------------------------------- */
  const rangedRoot = document.getElementById('panel-ranged');
  const meleeRoot = document.getElementById('panel-melee');
  const valueRoot = document.getElementById('panel-value');
  buildRanged(rangedRoot);
  buildMelee(meleeRoot);
  wire(rangedRoot, false);
  wire(meleeRoot, true);
  buildValue(valueRoot, scope);

  const gangBox = document.getElementById('opt-gang');
  const gangSel = document.getElementById('opt-which');
  gangSel.appendChild(el('option', { value: 'all', text: 'All House lists' }));
  for (const g of Data.gangs) gangSel.appendChild(el('option', { value: g, text: g }));
  gangBox.addEventListener('change', () => {
    scope.includeGang = gangBox.checked;
    gangSel.classList.toggle('hidden', !scope.includeGang);
    applyScope();
  });
  gangSel.addEventListener('change', () => { scope.gang = gangSel.value; applyScope(); });
  applyScope();

  const tabs = [document.getElementById('tab-ranged'), document.getElementById('tab-melee'),
                document.getElementById('tab-value')];
  const panels = [rangedRoot, meleeRoot, valueRoot];
  tabs.forEach((tab, i) => tab.addEventListener('click', () => {
    tabs.forEach((t, j) => t.setAttribute('aria-selected', String(i === j)));
    panels.forEach((p, j) => p.classList.toggle('hidden', i !== j));
    window.scrollTo(0, 0);
  }));
})();
</script>
</body>
</html>
